<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Valley College</title>
</head>
<body>
    <h1>Student Registration Form</h1><br>
    <fieldset> 
        <legend>Student Info:</legend>
    <form action = "#" method = "post">
        <label for = "Full name">Name: </label>
        <input type = "text" name = "Full Name" id = "name" required><br><br>

        <label for = "email">Email: </label>
        <input type = "email" name = "Email" id = "email" required><br><br>

        <label for = "pass">Password: </label>
        <input type = "password" name = "Password" id = "pass" required><br><br>

        <label for = "age">Age: </label>
        <input type = "number" name = "Age" id = "age" min="5" max="100" required><br><br>

        <label for = "dob">Date of Birth: </label>
        <input type = "date" name = "Date of Birth" id = "dob" required><br><br>


        Gender:
        <input type = "radio" name = "Gender" value= "Male"> Male
        <input type = "radio" name = "Gender" value= "Female"> Female
        <input type = "radio" name = "Gender" value= "Other"> Other<br><br>


        <label>City:</label>
        <select name = "city">
            <option value="dhaka">Dhaka</option>
            <option value="khulna">Khulna</option>
            <option value="rajshahi">Rajshahi</option>
            <option value="sylhet">Sylhet</option>
        </select><br><br>


        <label>Hobbies:</label>
        <input type = "checkbox" name = "Hobbies" value= "reading"> Reading
        <input type = "checkbox" name = "Hobbies" value= "cricket"> Cricket
        <input type = "checkbox" name = "Hobbies" value= "music"> Music<br><br>


        <label>About YourSelf:</label><br>
        <textarea name="About YourSelf" rows="5" cols="50">
        </textarea><br><br>


        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    
        </fieldset>
    </form>
</body>
</html>
